<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大鱼吃小鱼 · 精致画风</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(145deg,#0b1a2e,#1a2f3f);
    min-height:100vh; display:flex; justify-content:center;
    align-items:center; font-family:sans-serif; padding:16px;
  }
  .box {
    background:#0d1b2a; border-radius:32px; padding:24px;
    box-shadow:0 20px 40px rgba(0,0,0,.7);
    display:flex; flex-direction:column; align-items:center;
  }
  canvas {
    display:block; background:radial-gradient(circle at 30% 30%,#1e3b4f,#0a1620);
    border-radius:24px; box-shadow:0 0 0 3px #3a6177;
    cursor:none; width:800px; height:600px; max-width:100%; height:auto;
  }
  .stats {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; margin-top:18px; color:#b6e2f0; font-weight:600;
    gap:10px; flex-wrap:wrap;
  }
  .score { background:#11212e; padding:8px 20px; border-radius:40px;
    border:1px solid #3b687f; font-size:1.3rem; }
  .score span { color:#ffd966; font-size:1.8rem; font-weight:800; }
  .size { background:#0e2a36; padding:6px 18px; border-radius:40px;
    border:1px solid #47a3c9; font-size:1rem; }
  .size span { color:#6ed4ff; font-weight:800; font-size:1.4rem; }
  button {
    background:#1c465a; border:none; color:#ddf4ff; font-weight:700;
    font-size:1rem; padding:10px 22px; border-radius:50px;
    cursor:pointer; box-shadow:0 6px 0 #0e1e28; border:1px solid #4092b0;
  }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #0e1e28; }
  .mute-btn {
    background:#2a3a4a; padding:10px 16px; font-size:1.2rem;
  }
</style>
</head>
<body>
<div class="box">
  <canvas id="cv" width="800" height="600"></canvas>
  <div class="stats">
    <div class="score">🐟 <span id="score">0</span></div>
    <div class="size">⚡ 尺寸 <span id="size">1.0</span></div>
    <button class="mute-btn" id="muteBtn">🔊</button>
    <button id="restart">🔄 重来</button>
  </div>
</div>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const sizeEl = document.getElementById('size');
  const muteBtn = document.getElementById('muteBtn');
  const W = 800, H = 600;

  // ========== 音频 ==========
  let audioCtx = null;
  let muted = false;
  let bgmInterval = null;

  function initAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  function playTone(freq, duration, type, volume){
    if(muted || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }
  function playEatSound(playerSize){
    if(muted || !audioCtx) return;
    const baseFreq = 500 + Math.min(playerSize * 8, 400);
    playTone(baseFreq, 0.08, 'square', 0.12);
    setTimeout(() => playTone(baseFreq * 1.5, 0.08, 'square', 0.1), 50);
  }
  function playGameOverSound(){
    if(muted || !audioCtx) return;
    playTone(300, 0.3, 'sawtooth', 0.15);
    setTimeout(() => playTone(200, 0.4, 'sawtooth', 0.15), 150);
    setTimeout(() => playTone(100, 0.6, 'sawtooth', 0.15), 350);
  }
  let bgmIndex = 0;
  const bgmNotes = [
    262, 330, 392, 330, 294, 349, 440, 349,
    330, 392, 494, 392, 262, 330, 392, 523,
  ];
  function playBGMNote(){
    if(muted || !audioCtx) return;
    const freq = bgmNotes[bgmIndex % bgmNotes.length];
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
    bgmIndex++;
  }
  function startBGM(){
    if(bgmInterval) return;
    bgmInterval = setInterval(playBGMNote, 500);
  }
  function stopBGM(){
    if(bgmInterval){ clearInterval(bgmInterval); bgmInterval = null; }
  }

  // ========== 游戏 ==========
  let player, fishes, mouseX, mouseY, score, over, particles;
  const MAX_FISH = 55;

  // 更多鱼种 + 配色（每层颜色用于渐变）
  const FISH_TYPES = [
    { body:'#FF6B6B', fin:'#E63946', belly:'#FFB4B4', shape:'oval' },
    { body:'#4ECDC4', fin:'#1B9C94', belly:'#B5F5F0', shape:'oval' },
    { body:'#FFD166', fin:'#E0A800', belly:'#FFF0B3', shape:'slim' },
    { body:'#9B5DE5', fin:'#6A3BB8', belly:'#D8BFFF', shape:'round' },
    { body:'#F15BB5', fin:'#C13A8E', belly:'#FFC0E0', shape:'oval' },
    { body:'#00BBF9', fin:'#0089B8', belly:'#A0E4FF', shape:'slim' },
    { body:'#FEE440', fin:'#DDB800', belly:'#FFF8B0', shape:'round' },
    { body:'#FB8B24', fin:'#C45A00', belly:'#FFC98A', shape:'oval' },
    { body:'#41EAD4', fin:'#1AA898', belly:'#B0FFF3', shape:'slim' },
    { body:'#118AB2', fin:'#0A5A78', belly:'#8ECAE0', shape:'round' },
    { body:'#EF476F', fin:'#B82E50', belly:'#FF9DB3', shape:'oval' },
    { body:'#06D6A0', fin:'#04A87E', belly:'#9DFFE0', shape:'slim' },
  ];

  function reset(){
    over = false; score = 0;
    player = { x:W/2, y:H/2, r:18, baseR:18, grow:0, tail:0 };
    mouseX = player.x; mouseY = player.y;
    fishes = [];
    particles = [];
    for(let i=0;i<20;i++) spawn(true);
    updateUI();
    if(audioCtx) startBGM();
  }

  function spawn(force){
    if(!force && fishes.length >= MAX_FISH) return;
    let r = 8 + Math.random() * 34;
    if(player.r < 30) r = 8 + Math.random() * 20;
    else if(player.r < 55) r = 8 + Math.random() * 30;
    let x, y;
    for(let t=0;t<50;t++){
      if(Math.random()<0.4){
        const s = Math.floor(Math.random()*4);
        if(s===0){ x=Math.random()*W; y=-r-5; }
        else if(s===1){ x=Math.random()*W; y=H+r+5; }
        else if(s===2){ x=-r-5; y=Math.random()*H; }
        else { x=W+r+5; y=Math.random()*H; }
      } else {
        x = Math.random()*W; y = Math.random()*H;
      }
      const dx = x-player.x, dy = y-player.y;
      if(Math.sqrt(dx*dx+dy*dy) > 120 + player.r + r) break;
      if(t===49){
        x = 80 + Math.random()*(W-160);
        y = 80 + Math.random()*(H-160);
      }
    }
    const type = FISH_TYPES[Math.floor(Math.random()*FISH_TYPES.length)];
    const a = Math.random()*Math.PI*2;
    const sp = 0.4 + Math.random()*1.0;
    fishes.push({
      x, y, r,
      ...type,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      wig: Math.random()*100,
      tail: 0,
    });
  }

  function updateUI(){
    scoreEl.textContent = score;
    sizeEl.textContent = player.r.toFixed(1);
  }

  function updatePlayer(){
    if(over) return;
    const dx = mouseX - player.x, dy = mouseY - player.y;
    const sp = Math.max(0.06, 0.13 - (player.r-18)*0.0008);
    player.x += dx*sp; player.y += dy*sp;
    player.x = Math.max(player.r, Math.min(W-player.r, player.x));
    player.y = Math.max(player.r, Math.min(H-player.r, player.y));
    player.tail += 0.15;
  }

  function createParticles(x, y, color){
    for(let i=0;i<8;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 1 + Math.random()*3;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 30, maxLife: 30,
        color: color,
        size: 2 + Math.random()*3
      });
    }
  }

  function updateFishes(){
    for(let i=fishes.length-1;i>=0;i--){
      const f = fishes[i];
      f.wig = (f.wig+1)%100;
      f.tail += 0.15;
      f.x += f.vx + Math.sin(f.wig*0.1)*0.15;
      f.y += f.vy + Math.sin(f.wig*0.1)*0.15;
      if(f.x<f.r){ f.x=f.r; f.vx*=-0.9; }
      if(f.x>W-f.r){ f.x=W-f.r; f.vx*=-0.9; }
      if(f.y<f.r){ f.y=f.r; f.vy*=-0.9; }
      if(f.y>H-f.r){ f.y=H-f.r; f.vy*=-0.9; }

      const dx = player.x-f.x, dy = player.y-f.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if(d < player.r + f.r - 2){
        if(player.r > f.r + 1.5){
          createParticles(f.x, f.y, f.body);
          playEatSound(player.r);
          player.grow += f.r*0.28;
          player.r = Math.min(80, player.baseR + player.grow);
          score++;
          fishes.splice(i,1);
          if(fishes.length < MAX_FISH) spawn(true);
          updateUI();
        } else if(f.r > player.r + 1.5){
          over = true;
          stopBGM();
          playGameOverSound();
        }
      }
    }
  }

  function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.95;
      p.vy *= 0.95;
      p.life--;
      if(p.life <= 0) particles.splice(i,1);
    }
  }

  // ============================================================
  //  精致鱼绘制函数（画风大幅升级）
  // ============================================================
  function drawFishBody(shape, r, bodyColor, finColor, bellyColor, tailPhase){
    const wag = Math.sin(tailPhase) * 0.25; // 尾巴摆动角度

    // ===== 1. 鱼鳍（背鳍/胸鳍）=====
    ctx.save();
    ctx.fillStyle = finColor;

    // 背鳍（上方的三角形）
    ctx.beginPath();
    ctx.moveTo(-r*0.1, -r*0.65);
    ctx.quadraticCurveTo(r*0.2, -r*1.15, r*0.55, -r*0.55);
    ctx.quadraticCurveTo(r*0.3, -r*0.7, r*0.1, -r*0.65);
    ctx.closePath();
    ctx.fill();

    // 腹鳍（下方的三角形）
    ctx.beginPath();
    ctx.moveTo(0, r*0.6);
    ctx.quadraticCurveTo(r*0.2, r*1.0, r*0.5, r*0.55);
    ctx.quadraticCurveTo(r*0.3, r*0.65, r*0.1, r*0.6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // ===== 2. 尾鳍（可以摆动）=====
    ctx.save();
    ctx.translate(-r*0.85, 0);
    ctx.rotate(wag);
    ctx.fillStyle = finColor;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-r*0.5, -r*0.7, -r*1.0, -r*0.5);
    ctx.quadraticCurveTo(-r*0.7, -r*0.15, -r*0.7, 0);
    ctx.quadraticCurveTo(-r*0.7, r*0.15, -r*1.0, r*0.5);
    ctx.quadraticCurveTo(-r*0.5, r*0.7, 0, 0);
    ctx.closePath();
    ctx.fill();
    // 尾巴高光
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.moveTo(-r*0.1, 0);
    ctx.quadraticCurveTo(-r*0.5, -r*0.4, -r*0.85, -r*0.3);
    ctx.quadraticCurveTo(-r*0.5, -r*0.1, -r*0.1, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // ===== 3. 鱼身（用渐变做出立体感）=====
    let gradient;
    if(shape === 'slim'){
      gradient = ctx.createRadialGradient(-r*0.2, -r*0.3, r*0.1, 0, 0, r*1.2);
    } else if(shape === 'round'){
      gradient = ctx.createRadialGradient(-r*0.2, -r*0.3, r*0.1, 0, 0, r*1.1);
    } else {
      gradient = ctx.createRadialGradient(-r*0.2, -r*0.3, r*0.1, 0, 0, r*1.1);
    }
    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(0.15, bodyColor);
    gradient.addColorStop(0.7, bodyColor);
    gradient.addColorStop(1, finColor);

    ctx.fillStyle = gradient;
    ctx.beginPath();
    if(shape === 'slim'){
      ctx.ellipse(0, 0, r*1.15, r*0.65, 0, 0, Math.PI*2);
    } else if(shape === 'round'){
      ctx.arc(0, 0, r*0.95, 0, Math.PI*2);
    } else {
      ctx.ellipse(0, 0, r, r*0.78, 0, 0, Math.PI*2);
    }
    ctx.fill();

    // 描边
    ctx.strokeStyle = finColor;
    ctx.lineWidth = Math.max(1, r*0.08);
    ctx.stroke();

    // ===== 4. 鱼肚（浅色区域，增加层次）=====
    ctx.save();
    ctx.beginPath();
    if(shape === 'slim'){
      ctx.ellipse(0, r*0.2, r*0.85, r*0.35, 0, 0, Math.PI*2);
    } else if(shape === 'round'){
      ctx.ellipse(0, r*0.3, r*0.7, r*0.35, 0, 0, Math.PI*2);
    } else {
      ctx.ellipse(0, r*0.25, r*0.75, r*0.35, 0, 0, Math.PI*2);
    }
    ctx.fillStyle = bellyColor;
    ctx.globalAlpha = 0.5;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    // ===== 5. 鱼鳞纹理（弧线）=====
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = Math.max(0.5, r*0.04);
    const scaleCount = Math.max(2, Math.floor(r / 6));
    const scaleStartX = -r*0.5;
    const scaleEndX = r*0.5;
    for(let i=0;i<scaleCount;i++){
      const sx = scaleStartX + (scaleEndX - scaleStartX) * (i / (scaleCount-1));
      ctx.beginPath();
      ctx.arc(sx, 0, r*0.35, -Math.PI*0.4, Math.PI*0.4);
      ctx.stroke();
    }
    ctx.restore();

    // ===== 6. 鱼嘴（小弧线）=====
    ctx.save();
    ctx.strokeStyle = finColor;
    ctx.lineWidth = Math.max(1, r*0.07);
    ctx.beginPath();
    ctx.arc(r*0.7, r*0.15, r*0.15, 0, Math.PI*0.8);
    ctx.stroke();
    ctx.restore();

    // ===== 7. 鱼眼睛（带高光）=====
    const eyeX = r*0.42;
    const eyeY = -r*0.22;
    const eyeR = r*0.2;
    // 眼白
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = Math.max(0.5, r*0.03);
    ctx.stroke();
    // 瞳孔
    ctx.beginPath();
    ctx.arc(eyeX + eyeR*0.25, eyeY, eyeR*0.6, 0, Math.PI*2);
    ctx.fillStyle = '#111';
    ctx.fill();
    // 高光
    ctx.beginPath();
    ctx.arc(eyeX + eyeR*0.4, eyeY - eyeR*0.25, eyeR*0.25, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();
  }

  function drawPlayerFish(x, y, r, angle, tailPhase){
    const bodyColor = '#FFD966';
    const finColor = '#D99B00';
    const bellyColor = '#FFF2B0';

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // 玩家光环
    ctx.save();
    const glow = ctx.createRadialGradient(0, 0, r*0.5, 0, 0, r*2);
    glow.addColorStop(0, 'rgba(255,217,102,0.4)');
    glow.addColorStop(1, 'rgba(255,217,102,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r*2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // 绘制鱼（使用统一函数）
    drawFishBody('oval', r, bodyColor, finColor, bellyColor, tailPhase);

    ctx.restore();
  }

  function drawFish(x, y, r, bodyColor, finColor, bellyColor, angle, shape, tailPhase){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    drawFishBody(shape, r, bodyColor, finColor, bellyColor, tailPhase);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // 背景气泡
    ctx.fillStyle = 'rgba(100,180,220,0.05)';
    for(let i=0;i<15;i++){
      const bx = (i*137)%W, by = (Date.now()*0.02 + i*80)%H;
      ctx.beginPath();
      ctx.arc(bx, by, 8+i%20, 0, Math.PI*2);
      ctx.fill();
    }

    // 鱼群
    fishes.forEach(f=>{
      const a = Math.atan2(f.vy, f.vx);
      drawFish(f.x, f.y, f.r, f.body, f.fin, f.belly, a, f.shape, f.tail);
    });

    // 玩家
    const dir = Math.atan2(mouseY-player.y, mouseX-player.x);
    drawPlayerFish(player.x, player.y, player.r, dir, player.tail);

    // 粒子
    particles.forEach(p=>{
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // 结束画面
    if(over){
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 60px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 20;
      ctx.fillText('游戏结束', W/2, H/2);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = '28px sans-serif';
      ctx.fillText('最终分数: ' + score, W/2, H/2 + 60);
      ctx.font = '22px sans-serif';
      ctx.fillStyle = '#b6e2f0';
      ctx.fillText('点击"重来"重新开始', W/2, H/2 + 110);
    }
  }

  function loop(){
    if(!over){
      updatePlayer();
      updateFishes();
    }
    updateParticles();
    draw();
    requestAnimationFrame(loop);
  }

  cv.addEventListener('mousemove', e=>{
    const rect = cv.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
    mouseY = (e.clientY - rect.top) * (H / rect.height);
  });
  cv.addEventListener('touchmove', e=>{
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    const touch = e.touches[0];
    mouseX = (touch.clientX - rect.left) * (W / rect.width);
    mouseY = (touch.clientY - rect.top) * (H / rect.height);
  }, { passive: false });

  document.getElementById('restart').addEventListener('click', ()=>{
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    reset();
  });

  muteBtn.addEventListener('click', ()=>{
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if(muted) stopBGM();
    else if(!over) startBGM();
  });

  cv.addEventListener('click', ()=>{
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if(!over) startBGM();
  }, { once: true });

  reset();
  loop();
})();
</script>
</body>
</html>
