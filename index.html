<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大鱼吃小鱼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(145deg,#0b1a2e,#1a2f3f);
    min-height:100vh; display:flex; justify-content:center;
    align-items:center; font-family:sans-serif; padding:16px;
  }
  .box {
    background:#0d1b2a; border-radius:32px; padding:24px;
    box-shadow:0 20px 40px rgba(0,0,0,.7);
    display:flex; flex-direction:column; align-items:center;
  }
  canvas {
    display:block; background:radial-gradient(circle at 30% 30%,#1e3b4f,#0a1620);
    border-radius:24px; box-shadow:0 0 0 3px #3a6177;
    cursor:none; width:800px; height:600px; max-width:100%; height:auto;
  }
  .stats {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; margin-top:18px; color:#b6e2f0; font-weight:600;
  }
  .score { background:#11212e; padding:8px 24px; border-radius:40px;
    border:1px solid #3b687f; font-size:1.5rem; }
  .score span { color:#ffd966; font-size:2rem; font-weight:800; }
  .size { background:#0e2a36; padding:6px 20px; border-radius:40px;
    border:1px solid #47a3c9; font-size:1.1rem; }
  .size span { color:#6ed4ff; font-weight:800; font-size:1.6rem; }
  button {
    background:#1c465a; border:none; color:#ddf4ff; font-weight:700;
    font-size:1.1rem; padding:10px 30px; border-radius:50px;
    cursor:pointer; box-shadow:0 8px 0 #0e1e28; border:1px solid #4092b0;
  }
  button:active { transform:translateY(5px); box-shadow:0 3px 0 #0e1e28; }
</style>
</head>
<body>
<div class="box">
  <canvas id="cv" width="800" height="600"></canvas>
  <div class="stats">
    <div class="score">🐟 <span id="score">0</span></div>
    <div class="size">⚡ 尺寸 <span id="size">1.0</span></div>
    <button id="restart">🔄 重来</button>
  </div>
</div>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const sizeEl = document.getElementById('size');
  const W = 800, H = 600;

  let player, fishes, mouseX, mouseY, score, over;
  const MAX_FISH = 50;

  function reset(){
    over = false; score = 0;
    player = { x:W/2, y:H/2, r:18, baseR:18, grow:0 };
    mouseX = player.x; mouseY = player.y;
    fishes = [];
    for(let i=0;i<20;i++) spawn(true);
    updateUI();
  }

  function spawn(force){
    if(!force && fishes.length >= MAX_FISH) return;
    let r = 8 + Math.random() * 34;
    if(player.r < 30) r = 8 + Math.random() * 20;
    else if(player.r < 55) r = 8 + Math.random() * 30;
    let x, y;
    for(let t=0;t<50;t++){
      if(Math.random()<0.4){
        const s = Math.floor(Math.random()*4);
        if(s===0){ x=Math.random()*W; y=-r-5; }
        else if(s===1){ x=Math.random()*W; y=H+r+5; }
        else if(s===2){ x=-r-5; y=Math.random()*H; }
        else { x=W+r+5; y=Math.random()*H; }
      } else {
        x = Math.random()*W; y = Math.random()*H;
      }
      const dx = x-player.x, dy = y-player.y;
      if(Math.sqrt(dx*dx+dy*dy) > 120 + player.r + r) break;
      if(t===49){
        x = 80 + Math.random()*(W-160);
        y = 80 + Math.random()*(H-160);
      }
    }
    const colors = ['#FF6B6B','#4ECDC4','#FFD166','#9B5DE5','#F15BB5',
                    '#00BBF9','#FEE440','#FB8B24','#41EAD4','#118AB2'];
    const a = Math.random()*Math.PI*2;
    const sp = 0.4 + Math.random()*1.0;
    fishes.push({
      x, y, r,
      color: colors[Math.floor(Math.random()*colors.length)],
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      wig: Math.random()*100
    });
  }

  function updateUI(){
    scoreEl.textContent = score;
    sizeEl.textContent = player.r.toFixed(1);
  }

  function updatePlayer(){
    if(over) return;
    const dx = mouseX - player.x, dy = mouseY - player.y;
    const sp = Math.max(0.06, 0.13 - (player.r-18)*0.0008);
    player.x += dx*sp; player.y += dy*sp;
    player.x = Math.max(player.r, Math.min(W-player.r, player.x));
    player.y = Math.max(player.r, Math.min(H-player.r, player.y));
  }

  function updateFishes(){
    for(let i=fishes.length-1;i>=0;i--){
      const f = fishes[i];
      f.wig = (f.wig+1)%100;
      f.x += f.vx + Math.sin(f.wig*0.1)*0.15;
      f.y += f.vy + Math.sin(f.wig*0.1)*0.15;
      if(f.x<f.r){ f.x=f.r; f.vx*=-0.9; }
      if(f.x>W-f.r){ f.x=W-f.r; f.vx*=-0.9; }
      if(f.y<f.r){ f.y=f.r; f.vy*=-0.9; }
      if(f.y>H-f.r){ f.y=H-f.r; f.vy*=-0.9; }

      const dx = player.x-f.x, dy = player.y-f.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if(d < player.r + f.r - 2){
        if(player.r > f.r + 1.5){
          player.grow += f.r*0.28;
          player.r = Math.min(80, player.baseR + player.grow);
          score++;
          fishes.splice(i,1);
          if(fishes.length < MAX_FISH) spawn(true);
          updateUI();
        } else if(f.r > player.r + 1.5){
          over = true;
        }
      }
    }
  }

  function drawFish(x,y,r,color,angle){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.ellipse(0,0,r,r*0.75,0,0,Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r*0.9, 0);
    ctx.lineTo(-r*1.5, -r*0.5);
    ctx.lineTo(-r*1.5, r*0.5);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r*0.4, -r*0.2, r*0.18, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r*0.45, -r*0.2, r*0.08, 0, Math.PI*2);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    ctx.fillStyle = 'rgba(100,180,220,0.05)';
    for(let i=0;i<15;i++){
      const bx = (i*137)%W, by = (Date.now()*0.02 + i*80)%H;
      ctx.beginPath();
      ctx.arc(bx, by, 8+i%20, 0, Math.PI*2);
      ctx.fill();
    }

    fishes.forEach(f=>{
      const a = Math.atan2(f.vy, f.vx);
      drawFish(f.x, f.y, f.r, f.color, a);
    });

    const dir = Math.atan2(mouseY-player.y, mouseX-player.x);
    drawFish(player.x, player.y, player.r, '#ffd966', dir);

    if(over){
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 60px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('游戏结束', W/2, H/2);
      ctx.fillStyle = '#fff';
      ctx.font = '28px sans-serif';
      ctx.fillText('点击"重来"重新开始', W/2, H/2+60);
    }
  }

  function loop(){
    if(!over){
      updatePlayer();
      updateFishes();
    }
    draw();
    requestAnimationFrame(loop);
  }

  cv.addEventListener('mousemove', e=>{
    const rect = cv.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
    mouseY = (e.clientY - rect.top) * (H / rect.height);
  });

  document.getElementById('restart').addEventListener('click', ()=>{
    reset();
  });

  reset();
  loop();
})();
</script>
</body>
</html>
